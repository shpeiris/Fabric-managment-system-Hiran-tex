version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: fabric_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=fabric_management_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fabric_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=database
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=admin
      - DB_NAME=fabric_management_system
      - SESSION_SECRET=5da7fce7f30e14241cdd07b0968ff027db3bd80f924a80849c7e5569d2fc053a
      - JWT_SECRET=843f23007655986c3b76873da037559c4c5a754e179cd3c7f72431dd95202ff0
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - FRONTEND_URL=http://4.188.80.83:5173
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=hiranpeiris69@gmail.com
      - SMTP_PASSWORD=dzho atqr kmil jzgf
      - DEFAULT_PASSWORD_PREFIX=FabricMS@
      - DEFAULT_PASSWORD_ENABLED=true
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://4.188.80.83:5000
    container_name: fabric_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
